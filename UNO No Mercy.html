<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO No Mercy</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e1a14;--fg:#eef3ef;--mut:#9db0a4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at top,#1b3a2b,var(--bg));background-color:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:0}h3{margin:0 0 10px}.mut{color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 14px;margin:3px;background:#ffd23f;color:#222;cursor:pointer}
button.sec{background:#33473b;color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
.opps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opp{background:#0006;border:2px solid transparent;border-radius:10px;padding:6px 10px;min-width:100px}
.opp.cur{border-color:#ffd23f}.opp.out{opacity:.35;text-decoration:line-through}.opp.warn b{color:#ff7b7b}
.table{display:flex;gap:26px;justify-content:center;align-items:center;margin:16px 0;flex-wrap:wrap}
.card{width:64px;height:96px;border-radius:9px;background:var(--c);border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex:none;text-shadow:0 1px 3px #000}
.card b{font-size:24px}.card i{font-size:9px;font-style:normal;font-weight:700;text-align:center}
.card.w{background:conic-gradient(#d72600 0 25%,#0b6fd1 0 50%,#2a9d48 0 75%,#edb500 0)}
.card.back{background:#111;border-color:#d72600}
.card.big{width:84px;height:126px}.card.big b{font-size:32px}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 0}
.hand .card.ok{cursor:pointer;transform:translateY(-8px);box-shadow:0 0 0 3px #ffd23f}
.hand .card.no{opacity:.45}
.pend{background:#b3261e;border-radius:8px;padding:6px 12px;font-weight:800}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;border:2px solid #fff}
.log{min-height:70px;color:var(--mut);text-align:center;font-size:14px}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.box{background:#1b2a22;border-radius:14px;padding:20px;max-width:380px;width:100%;text-align:center}
.box button{display:block;width:100%;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
input[type=text]{font:inherit;padding:8px;border-radius:8px;border:1px solid #4a6155;background:#0e1a14;color:#fff;width:150px}
details{margin-top:16px;background:#0005;padding:10px 14px;border-radius:10px;line-height:1.5}
.flying-card{position:fixed;z-index:9999;pointer-events:none;margin:0;box-shadow:0 14px 28px rgba(0,0,0,0.6),0 0 16px rgba(255,255,255,0.3);will-change:transform,opacity}
@keyframes deckImpact{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(calc(var(--rot,0deg) + 3deg))}70%{transform:scale(0.97) rotate(calc(var(--rot,0deg) - 1deg))}100%{transform:scale(1) rotate(var(--rot,0deg))}}
.pile-impact{animation:deckImpact 0.28s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes oppThrow{0%{transform:scale(1)}40%{transform:scale(1.08) translateY(-4px);border-color:#ffd23f}100%{transform:scale(1)}}
.opp-play{animation:oppThrow 0.3s ease-out}
</style></head><body><div id="app"></div>
<script>
const C={R:'#d72600',Y:'#d99a00',G:'#2a9d48',B:'#0b6fd1',W:'#222'};
const NAMES={R:'Red',Y:'Yellow',G:'Green',B:'Blue'};
const LBL={skip:'⊘',rev:'⇄',d2:'+2',discard:'✕',d4:'+4',skipall:'⊘⊘',wrd4:'⇄+4',wd6:'+6',wd10:'+10',roul:'?'};
const NM={skip:'Skip',rev:'Reverse',d2:'Draw 2',discard:'Discard All',d4:'Draw 4',skipall:'Skip Everyone',wrd4:'Wild Reverse Draw 4',wd6:'Wild Draw 6',wd10:'Wild Draw 10',roul:'Wild Color Roulette'};
const DV={d2:2,d4:4,wrd4:4,wd6:6,wd10:10};
const dv=c=>DV[c.type]||0;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);
let G=null,T=null,uid=0,S=[{name:'You',bot:false},{name:'Bot 1',bot:true},{name:'Bot 2',bot:true},{name:'Bot 3',bot:true}];

function mk(color,type){return{id:uid++,color,type}}
function build(){uid=0;const d=[];
 for(const c of 'RYGB'){for(let n=0;n<=9;n++)d.push(mk(c,''+n),mk(c,''+n));
  for(let i=0;i<3;i++)d.push(mk(c,'skip'),mk(c,'rev'),mk(c,'d2'),mk(c,'discard'));
  for(let i=0;i<2;i++)d.push(mk(c,'d4'),mk(c,'skipall'))}
 for(let i=0;i<8;i++)d.push(mk('W','wrd4'),mk('W','wd6'));
 for(let i=0;i<4;i++)d.push(mk('W','wd10'),mk('W','roul'));
 return d}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const desc=c=>(c.color!=='W'?NAMES[c.color]+' ':'')+(/^\d$/.test(c.type)?c.type:NM[c.type]);
const act=()=>G.pl.map((p,i)=>i).filter(i=>!G.pl[i].out);
function nxt(i){const n=G.pl.length;do{i=(i+G.dir+n)%n}while(G.pl[i].out);return i}
function dr(){if(!G.deck.length){const t=G.disc.pop();G.deck=sh(G.disc);G.disc=[t]}return G.deck.pop()||null}
function log(s){G.lg.push(s);G.lg=G.lg.slice(-4)}
function canPlay(c){const t=G.top;if(G.pend)return dv(c)>0&&dv(c)>=dv(t);return c.color==='W'||c.color===G.color||c.type===t.type}
const hasPlay=p=>p.hand.some(canPlay);

function start(list){
 G={deck:sh(build()),disc:[],pl:list.map(p=>({...p,hand:[],out:false})),cur:0,dir:1,pend:0,color:null,top:null,modal:null,lg:[],win:null,revealed:false};
 G.humans=G.pl.filter(p=>!p.bot).length;
 for(let i=0;i<7;i++)G.pl.forEach(p=>p.hand.push(G.deck.pop()));
 let c;while(true){c=G.deck.pop();if(/^\d$/.test(c.type))break;G.deck.unshift(c)}
 G.disc=[c];G.top=c;G.color=c.color;log('Game started. First card: '+desc(c));
 render();tick()}

function mercy(){
 G.pl.forEach(p=>{if(!p.out&&p.hand.length>=25){p.out=true;G.deck=sh(G.deck.concat(p.hand));p.hand=[];log('💀 '+p.name+' reached 25 cards and is out (Mercy Rule)')}});
 const a=act();if(a.length===1&&G.win===null)G.win=a[0]}
function end(skip=0,from=G.cur){let c=from;for(let k=0;k<=skip;k++)c=nxt(c);G.cur=c;G.revealed=false;render();tick()}

let isAnimating=false;
function playCardSound(type='throw'){
 try{
  const ctx=window._aCtx||(window._aCtx=new (window.AudioContext||window.webkitAudioContext)());
  if(ctx.state==='suspended')ctx.resume();
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);
  if(type==='throw'){
   osc.type='sine';osc.frequency.setValueAtTime(450,ctx.currentTime);
   osc.frequency.exponentialRampToValueAtTime(160,ctx.currentTime+0.1);
   gain.gain.setValueAtTime(0.18,ctx.currentTime);
   gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.1);
   osc.start();osc.stop(ctx.currentTime+0.1);
  }else{
   osc.type='triangle';osc.frequency.setValueAtTime(220,ctx.currentTime);
   osc.frequency.exponentialRampToValueAtTime(60,ctx.currentTime+0.08);
   gain.gain.setValueAtTime(0.28,ctx.currentTime);
   gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.08);
   osc.start();osc.stop(ctx.currentTime+0.08);
  }
 }catch(e){}
}

function animateCardThrow(i,card,done){
 const toEl=$('#topCard')||$('.table .card:nth-child(2)');
 let fromEl=$(`.hand .card[data-id="${card.id}"]`);
 if(!fromEl||fromEl.offsetParent===null)fromEl=$(`.opp[data-seat="${i}"]`);
 if(!fromEl||!toEl){done();return}
 isAnimating=true;
 const f=fromEl.getBoundingClientRect(),t=toEl.getBoundingClientRect();
 if(fromEl.classList.contains('card'))fromEl.style.visibility='hidden';
 else{fromEl.classList.remove('opp-play');void fromEl.offsetWidth;fromEl.classList.add('opp-play')}
 const fly=document.createElement('div');
 fly.className=`card ${card.color==='W'?'w':''} flying-card`;
 fly.style.cssText=`position:fixed;left:${f.left}px;top:${f.top}px;width:${f.width||64}px;height:${f.height||96}px;--c:${C[card.color]};`;
 fly.innerHTML=`<b>${face(card)}</b>${/^\d$/.test(card.type)?'':`<i>${NM[card.type]}</i>`}`;
 document.body.appendChild(fly);
 const dx=(t.left+t.width/2)-(f.left+f.width/2);
 const dy=(t.top+t.height/2)-(f.top+f.height/2);
 const rot=(Math.random()*28-14);
 const midY=dy*0.4-(Math.abs(dx)>70?45:25);
 const targetScale=t.width/(f.width||64);
 playCardSound('throw');
 const anim=fly.animate([
  {transform:'translate(0,0) scale(1) rotate(0deg)',opacity:0.92},
  {transform:`translate(${dx*0.45}px,${midY}px) scale(${Math.max(1.15,targetScale*0.92)}) rotate(${rot*0.6}deg)`,opacity:1,offset:0.45},
  {transform:`translate(${dx}px,${dy}px) scale(${targetScale}) rotate(${rot}deg)`,opacity:1}
 ],{duration:280,easing:'cubic-bezier(0.22,0.9,0.3,1)'});
 anim.onfinish=()=>{
  fly.remove();
  isAnimating=false;
  playCardSound('impact');
  done();
  const newTop=$('#topCard');
  if(newTop){
   newTop.style.setProperty('--rot',`${rot}deg`);
   newTop.classList.remove('pile-impact');
   void newTop.offsetWidth;
   newTop.classList.add('pile-impact');
  }
 };
}

function play(i,card,chosen,tgt){
 animateCardThrow(i,card,()=>execPlay(i,card,chosen,tgt));
}

function execPlay(i,card,chosen,tgt){
 const p=G.pl[i],t=card.type;
 p.hand=p.hand.filter(c=>c.id!==card.id);G.disc.push(card);G.top=card;
 if(card.color!=='W')G.color=card.color;else if(chosen)G.color=chosen;
 log(p.name+' played '+desc(card)+(card.color==='W'&&chosen?' → '+NAMES[chosen]:''));
 if(t==='discard'){const ex=p.hand.filter(c=>c.color===card.color);p.hand=p.hand.filter(c=>c.color!==card.color);G.disc.unshift(...ex);if(ex.length)log(p.name+' discarded '+ex.length+' more '+NAMES[card.color]+' card(s)')}
 if(!p.hand.length){G.win=i;return render()}
 let skip=0,again=false;
 if(t==='skip')skip=1;
 if(t==='rev'||t==='wrd4'){G.dir*=-1;if(t==='rev'&&act().length===2)skip=1}
 if(dv(card))G.pend+=dv(card);
 if(t==='skipall'){again=true;log('Everyone else is skipped!')}
 if(t==='7'&&tgt!=null){const a=G.pl[tgt];[p.hand,a.hand]=[a.hand,p.hand];log(p.name+' swapped hands with '+a.name)}
 if(t==='0'){const o=[i];let j=nxt(i);while(j!==i){o.push(j);j=nxt(j)}
  const h=o.map(k=>G.pl[k].hand);o.forEach((k,n)=>G.pl[k].hand=h[(n-1+o.length)%o.length]);log('All hands rotate!')}
 mercy();if(G.win!==null)return render();
 if(t==='roul'){const w=nxt(i);G.modal={type:'roul',who:w};render();
  if(G.pl[w].bot)setTimeout(()=>roul(botColor(G.pl[w])),1000);return}
 if(again){render();tick();return}
 end(skip)}

function roul(col){
 const w=G.modal.who;G.modal=null;G.color=col;let n=0;
 while(true){const c=dr();if(!c)break;G.pl[w].hand.push(c);n++;if(c.color===col)break}
 log(G.pl[w].name+' chose '+NAMES[col]+' and drew '+n+' card(s), turn skipped');
 mercy();if(G.win!==null)return render();end(0,w)}

function drawAct(i){
 const p=G.pl[i];let pen=G.pend>0;
 if(pen){log(p.name+' drew '+G.pend+' (penalty)');for(let k=0;k<G.pend;k++){const c=dr();if(!c)break;p.hand.push(c)}G.pend=0}
 else{let n=0;while(true){const c=dr();if(!c)break;p.hand.push(c);n++;if(canPlay(c)||p.hand.length>=25)break}log(p.name+' drew '+n+' card(s)')}
 mercy();if(G.win!==null)return render();
 if(pen||p.out||!hasPlay(p))return end(0);
 render();tick()}

/* human actions */
const canAct=()=>G&&G.win===null&&!G.modal&&!G.pl[G.cur].bot&&(G.humans<2||G.revealed);
function pick(id){if(!canAct())return;const i=G.cur,c=G.pl[i].hand.find(x=>x.id==id);if(!c||!canPlay(c))return;
 if(c.type==='7'){G.modal={type:'target',card:c};return render()}
 if(c.color==='W'&&c.type!=='roul'){G.modal={type:'color',card:c};return render()}
 play(i,c)}
function mC(col){const c=G.modal.card;G.modal=null;play(G.cur,c,col)}
function mT(j){const c=G.modal.card;G.modal=null;play(G.cur,c,null,j)}
function doDraw(){if(canAct())drawAct(G.cur)}
function reveal(){G.revealed=true;render()}

/* bots */
function botColor(p){const n={R:0,Y:0,G:0,B:0};p.hand.forEach(c=>{if(c.color!=='W')n[c.color]++});
 const m=Math.max(...Object.values(n));const best=Object.keys(n).filter(k=>n[k]===m);return best[Math.random()*best.length|0]}
function tick(){clearTimeout(T);if(!G||G.win!==null||G.modal||!G.pl[G.cur].bot)return;T=setTimeout(botMove,950)}
function botMove(){
 if(G.win!==null||G.modal)return;const i=G.cur,p=G.pl[i];if(!p.bot)return;
 const opts=p.hand.filter(canPlay);if(!opts.length)return drawAct(i);
 const nx=G.pl[nxt(i)].hand.length;
 const others=act().filter(j=>j!==i).sort((a,b)=>G.pl[a].hand.length-G.pl[b].hand.length);
 const minO=G.pl[others[0]].hand.length;
 const sc=c=>{let s=Math.random(),v=dv(c);
  if(v)s+=nx<=4?3+v/10:(G.pend?4:.3);
  if(c.type==='skipall')s+=1.5;
  if(c.type==='discard')s+=1+p.hand.filter(x=>x.color===c.color).length*.5;
  if(c.type==='roul')s+=.8;
  if(c.type==='7')s+=p.hand.length>minO?1.5:-3;
  if(c.color==='W')s-=1;return s};
 opts.sort((a,b)=>sc(b)-sc(a));const c=opts[0];
 play(i,c,c.color==='W'?botColor(p):null,c.type==='7'?others[0]:null)}

/* UI */
function face(c){return /^\d$/.test(c.type)?c.type:LBL[c.type]}
function cardH(c,extra='',click=''){return `<div class="card ${c.color==='W'?'w':''} ${extra}" style="--c:${C[c.color]}" title="${desc(c)}" ${click}><b>${face(c)}</b>${/^\d$/.test(c.type)?'':`<i>${NM[c.type]}</i>`}</div>`}
function seat(d){if(S.length+d<2||S.length+d>6)return;if(d>0)S.push({name:'Bot '+S.length,bot:true});else S.pop();render()}
function go(){start(S.map((s,i)=>({name:esc(s.name.trim()||'Player '+(i+1)),bot:s.bot})))}
function setupH(){return `<h1>UNO Show ’Em No Mercy</h1>
<p class="mut">Pass-and-play with friends on one device, with optional bots. Untick “Bot” for each real player (2–6 seats).</p>
${S.map((s,i)=>`<div class="row"><input type="text" maxlength="12" value="${esc(s.name)}" oninput="S[${i}].name=this.value"><label><input type="checkbox" ${s.bot?'checked':''} onchange="S[${i}].bot=this.checked"> Bot</label></div>`).join('')}
<div class="row"><button class="sec" onclick="seat(1)">+ Seat</button><button class="sec" onclick="seat(-1)">− Seat</button><button onclick="go()">Start game</button></div>
<details><summary>Rules in this game</summary>
<p>168 cards. Match color, number or symbol; wilds always playable.<br>
<b>Stacking:</b> when a draw card hits you, play a draw card of equal or higher value (+2 → +4 → +6 → +10) or draw the total.<br>
<b>7:</b> swap hands with a player. <b>0:</b> all hands pass in the direction of play.<br>
<b>Discard All:</b> dump every card of that color from your hand. <b>Skip Everyone:</b> play again.<br>
<b>Wild Color Roulette:</b> next player picks a color and draws until it appears, then loses their turn.<br>
<b>No playable card:</b> draw until you get one you can play.<br>
<b>Mercy:</b> reach 25 cards and you are out. Empty your hand (or be last standing) to win.</p></details>`}

function render(){
 const a=$('#app');if(!G){a.innerHTML=setupH();return}
 const cur=G.pl[G.cur];
 const v=G.humans===1?G.pl.findIndex(p=>!p.bot):(!cur.bot&&G.revealed?G.cur:-1);
 const mine=v>=0&&v===G.cur&&G.win===null&&!G.modal;
 let h=`<div class="bar"><h1>UNO No Mercy</h1><div><span class="mut">${G.dir===1?'↻ clockwise':'↺ counter-clockwise'} · deck ${G.deck.length}</span> <button class="sec" onclick="if(confirm('Quit to setup?')){clearTimeout(T);G=null;render()}">Menu</button></div></div>`;
 h+=`<div class="opps">${G.pl.map((p,i)=>`<div class="opp ${i===G.cur&&!G.win&&G.win!==0?'cur':''} ${p.out?'out':''} ${p.hand.length>=20?'warn':''}">${p.name}${p.bot?' 🤖':''}<br><b>${p.hand.length}</b> / 25 cards</div>`).join('')}</div>`;
 h+=`<div class="table"><div class="card back big"><b>UNO</b><i>${G.deck.length}</i></div>${cardH(G.top,'big')}<div><div>Color: <span class="dot" style="background:${C[G.color]}"></span> <b>${NAMES[G.color]}</b></div>${G.pend?`<div class="pend" style="margin-top:8px">+${G.pend} to draw!</div>`:''}<div style="margin-top:8px">Turn: <b>${cur.name}</b></div></div></div>`;
 h+=`<div class="log">${G.lg.map(esc2).join('<br>')}</div>`;
 if(v>=0){const hand=[...G.pl[v].hand].sort((x,y)=>('RYGBW'.indexOf(x.color)-'RYGBW'.indexOf(y.color))||(x.type>y.type?1:-1));
  h+=`<div class="hand">${hand.map(c=>{const ok=mine&&canPlay(c);return cardH(c,mine?(ok?'ok':'no'):'',ok?`onclick="pick(${c.id})"`:'')}).join('')}</div>`;
  if(mine)h+=`<div style="text-align:center"><button onclick="doDraw()" ${!G.pend&&hasPlay(G.pl[v])?'disabled':''}>${G.pend?'Draw '+G.pend+' (take penalty)':'Draw card(s)'}</button></div>`}
 else h+=`<p class="mut" style="text-align:center">${G.humans>1?'Hands hidden between turns.':'Watching…'}</p>`;
 let ov='';
 if(G.win!==null)ov=`<div class="ov"><div class="box"><h3>🏆 ${G.pl[G.win].name} wins!</h3><button onclick="go()">Play again</button><button class="sec" onclick="G=null;render()">Change players</button></div></div>`;
 else if(G.modal){const m=G.modal;
  if(!(m.type==='roul'&&G.pl[m.who].bot)){
   const cols='RYGB'.split('').map(c=>`<button style="background:${C[c]};color:#fff" onclick="${m.type==='roul'?'roul':'mC'}('${c}')">${NAMES[c]}</button>`).join('');
   const cancel=`<button class="sec" onclick="G.modal=null;render()">Cancel</button>`;
   ov=`<div class="ov"><div class="box">${m.type==='target'?`<h3>Swap hands with…</h3>${act().filter(j=>j!==G.cur).map(j=>`<button onclick="mT(${j})">${G.pl[j].name} (${G.pl[j].hand.length} cards)</button>`).join('')}${cancel}`:`<h3>${m.type==='roul'?G.pl[m.who].name+', pick a color to draw until':'Choose a color'}</h3>${cols}${m.type==='color'?cancel:''}`}</div></div>`}}
 else if(G.humans>1&&!cur.bot&&!G.revealed)ov=`<div class="ov"><div class="box"><h3>Pass the device to ${cur.name}</h3><button onclick="reveal()">I’m ${cur.name} — show my cards</button></div></div>`;
 a.innerHTML=h+ov}
const esc2=s=>s;
render();
</script></body></html>
